kind = "web"
previewPath = "/"
title = "Wedding Website"
description = "An informational wedding website that helps guests connect with the couple and plan their visit, with event details, the couple's story, travel guidance, and a practical FAQ."
version = "1.0.0"
id = "artifacts/wedding-website"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23245

[services.development]
run = "pnpm --filter @workspace/wedding-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wedding-website", "run", "build" ]
serve = "static"
publicDir = "artifacts/wedding-website/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23245"
BASE_PATH = "/"
